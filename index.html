<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duelo de IA — Mapa de Herramientas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f9fc;
    --surface: #ffffff;
    --surface-alt: #eef2fb;
    --accent: #5b8dee;
    --accent-light: #d6e4ff;
    --text: #1e2a3a;
    --text-muted: #6b7a99;
    --border: #dde3f0;
    --success: #4caf82;
    --error: #e57373;
    --shadow: 0 2px 12px rgba(0,0,0,0.07);
    --cat: #5b8dee;
    --cat-light: #d6e4ff;
  }
  :root[data-theme="dark"] {
    --bg: #12172a;
    --surface: #1a2140;
    --surface-alt: #222a4d;
    --accent: #7aabf7;
    --accent-light: #2a3a6a;
    --text: #e8edf8;
    --text-muted: #93a1c9;
    --border: #2e3a5a;
    --shadow: 0 2px 16px rgba(0,0,0,0.35);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12172a;
      --surface: #1a2140;
      --surface-alt: #222a4d;
      --accent: #7aabf7;
      --accent-light: #2a3a6a;
      --text: #e8edf8;
      --text-muted: #93a1c9;
      --border: #2e3a5a;
      --shadow: 0 2px 16px rgba(0,0,0,0.35);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Open Sans', sans-serif;
    display: flex;
    min-height: 100vh;
    overflow-x: hidden;
  }
  h1, h2, h3, h4, .brand, .cat-name, .card-title { font-family: 'Outfit', sans-serif; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 290px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100vh;
    position: sticky;
    top: 0;
    padding: 22px 16px;
    gap: 18px;
    z-index: 20;
    transition: transform 0.25s ease;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    font-size: 1.15rem;
    padding: 0 4px;
  }
  .brand .logo { font-size: 1.6rem; }
  .brand small {
    display: block;
    font-family: 'Open Sans', sans-serif;
    font-weight: 500;
    color: var(--text-muted);
    font-size: 0.72rem;
    margin-top: 2px;
  }

  .search-box {
    position: relative;
  }
  .search-box input {
    width: 100%;
    padding: 10px 14px 10px 36px;
    border-radius: 12px;
    border: 2px solid var(--border);
    background: var(--surface-alt);
    color: var(--text);
    font-family: 'Open Sans', sans-serif;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-box::before {
    content: '🔎';
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.85rem;
    opacity: 0.7;
    pointer-events: none;
  }

  .nav-scroll {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding-right: 4px;
  }
  .nav-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    text-align: left;
    padding: 10px 12px;
    border-radius: 12px;
    border: none;
    background: transparent;
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    font-weight: 600;
    font-size: 0.92rem;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .nav-btn:hover { background: var(--surface-alt); }
  .nav-btn.active {
    background: var(--cat-btn-color, var(--accent-light));
    color: var(--text);
  }
  .nav-btn .nav-ico {
    font-size: 1.1rem;
    width: 26px;
    text-align: center;
  }
  .nav-btn .nav-count {
    margin-left: auto;
    font-family: 'Open Sans', sans-serif;
    font-weight: 700;
    font-size: 0.72rem;
    background: rgba(0,0,0,0.06);
    padding: 2px 8px;
    border-radius: 20px;
    color: var(--text-muted);
  }
  :root[data-theme="dark"] .nav-btn .nav-count,
  :root:not([data-theme="light"]) .nav-btn .nav-count { background: rgba(255,255,255,0.08); }

  .sidebar-footer {
    font-size: 0.72rem;
    color: var(--text-muted);
    padding: 8px 4px 0;
    border-top: 1px solid var(--border);
    line-height: 1.5;
  }

  .theme-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 9px 12px;
    border-radius: 12px;
    border: 2px solid var(--border);
    background: var(--surface-alt);
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
  }

  /* ---------- Main ---------- */
  .main {
    flex: 1;
    min-width: 0;
    padding: 30px 40px 60px;
  }
  .topbar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 26px;
    flex-wrap: wrap;
  }
  .topbar h1 {
    margin: 0;
    font-size: 1.7rem;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .topbar .subtitle {
    color: var(--text-muted);
    font-size: 0.95rem;
    margin-top: 4px;
  }
  .menu-toggle {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 1.1rem;
    cursor: pointer;
  }

  /* ---------- Home ---------- */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 16px;
    margin-bottom: 30px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 18px 20px;
    box-shadow: var(--shadow);
  }
  .stat-card .num { font-size: 1.9rem; font-weight: 800; color: var(--accent); }
  .stat-card .lbl { color: var(--text-muted); font-size: 0.82rem; margin-top: 2px; }

  .cat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 18px;
  }
  .cat-tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 22px;
    box-shadow: var(--shadow);
    cursor: pointer;
    border-left: 6px solid var(--tile-color, var(--accent));
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .cat-tile:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
  .cat-tile .ico { font-size: 1.8rem; }
  .cat-tile h3 { margin: 10px 0 4px; font-size: 1.05rem; }
  .cat-tile p { margin: 0; color: var(--text-muted); font-size: 0.82rem; line-height: 1.4; }
  .cat-tile .count-badge {
    display: inline-block;
    margin-top: 10px;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--tile-color, var(--accent));
    background: color-mix(in srgb, var(--tile-color, var(--accent)) 15%, transparent);
    padding: 3px 10px;
    border-radius: 20px;
  }

  /* ---------- Cards grid ---------- */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 18px;
    align-items: start;
  }
  .tool-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: var(--shadow);
    overflow: hidden;
    border-top: 4px solid var(--cat-color, var(--accent));
  }
  .card-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 18px;
    cursor: pointer;
    user-select: none;
  }
  .card-head .card-ico {
    font-size: 1.5rem;
    width: 40px;
    height: 40px;
    min-width: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    background: var(--cat-light, var(--accent-light));
  }
  .card-title { font-size: 1rem; font-weight: 700; line-height: 1.3; flex: 1; }
  .chevron { font-size: 0.9rem; color: var(--text-muted); transition: transform 0.2s ease; }
  .tool-card.open .chevron { transform: rotate(180deg); }

  .card-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.28s ease;
  }
  .tool-card.open .card-body { max-height: 2600px; }
  .card-body-inner { padding: 0 18px 18px; display: flex; flex-direction: column; gap: 14px; }

  .field { }
  .field .field-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--cat-color, var(--accent));
    margin-bottom: 5px;
  }
  .field .field-text {
    font-size: 0.88rem;
    line-height: 1.55;
    color: var(--text);
  }
  .field .field-text strong { color: var(--text); }

  .steps {
    margin: 0;
    padding-left: 20px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .steps li { font-size: 0.87rem; line-height: 1.5; padding-left: 2px; }

  .example-box {
    background: var(--surface-alt);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 0.87rem;
    line-height: 1.55;
    border-left: 3px solid var(--cat-color, var(--accent));
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }
  .empty-state .big { font-size: 2.4rem; margin-bottom: 10px; }

  .search-meta {
    color: var(--text-muted);
    font-size: 0.85rem;
    margin-bottom: 16px;
  }
  mark {
    background: var(--accent-light);
    color: var(--text);
    padding: 0 2px;
    border-radius: 3px;
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }

  @media (max-width: 880px) {
    .sidebar {
      position: fixed;
      left: 0; top: 0;
      transform: translateX(-100%);
      box-shadow: 0 0 30px rgba(0,0,0,0.2);
    }
    .sidebar.open { transform: translateX(0); }
    .menu-toggle { display: inline-flex; }
    .main { padding: 20px 18px 50px; }
    .overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 15;
    }
    .overlay.show { display: block; }
  }
</style>
</head>
<body>

<div class="overlay" id="overlay"></div>

<aside class="sidebar" id="sidebar">
  <div class="brand"><span class="logo">🥊</span><div>Duelo de IA<small>Mapa de herramientas del cuaderno</small></div></div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Buscar herramienta, palabra clave...">
  </div>
  <nav class="nav-scroll" id="navScroll"></nav>
  <button class="theme-toggle" id="themeToggle" aria-label="Cambiar tema claro/oscuro">🌗 <span id="themeLabel">Modo automático</span></button>
  <div class="sidebar-footer">Generado desde el cuaderno de NotebookLM<br><strong>"Duelo de IA: GPT-5.6 Sol contra Fable 5"</strong> — 71 fuentes analizadas.</div>
</aside>

<main class="main">
  <div class="topbar">
    <div>
      <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">☰</button>
      <h1 id="viewTitle">Inicio</h1>
      <div class="subtitle" id="viewSubtitle">Panorama general del cuaderno</div>
    </div>
  </div>
  <div id="content"></div>
</main>

  const App = {
    view: 'home',          // 'home' | categoryId | 'search'
    query: '',
    expanded: new Set(),   // keys "catId::idx" of open cards
    theme: localStorage.getItem('dia-theme') || 'auto'
  };

  const contentEl = document.getElementById('content');
  const viewTitle = document.getElementById('viewTitle');
  const viewSubtitle = document.getElementById('viewSubtitle');
  const navScroll = document.getElementById('navScroll');
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');

  function totalItems() {
    return DATA.categories.reduce((s, c) => s + c.items.length, 0);
  }

  function fmt(str) {
    if (!str) return '';
    return str.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  }

  function highlight(str, q) {
    if (!q) return fmt(str);
    const esc = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp('(' + esc + ')', 'ig');
    return fmt(str).replace(re, '<mark>$1</mark>');
  }

  function renderSidebarNav() {
    navScroll.innerHTML = '';
    const homeBtn = document.createElement('button');
    homeBtn.className = 'nav-btn' + (App.view === 'home' ? ' active' : '');
    homeBtn.style.setProperty('--cat-btn-color', 'var(--accent-light)');
    homeBtn.innerHTML = '<span class="nav-ico">🏠</span><span>Inicio</span>';
    homeBtn.addEventListener('click', () => { App.view = 'home'; App.query=''; document.getElementById('searchInput').value=''; render(); });
    navScroll.appendChild(homeBtn);

    DATA.categories.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'nav-btn' + (App.view === cat.id ? ' active' : '');
      btn.style.setProperty('--cat-btn-color', cat.light);
      btn.innerHTML = `<span class="nav-ico">${cat.icon}</span><span>${cat.name}</span><span class="nav-count">${cat.items.length}</span>`;
      btn.addEventListener('click', () => { App.view = cat.id; App.query=''; document.getElementById('searchInput').value=''; render(); closeMobileSidebar(); });
      navScroll.appendChild(btn);
    });
  }

  function cardTemplate(item, cat, key, q) {
    const isOpen = App.expanded.has(key);
    return `
      <div class="tool-card ${isOpen ? 'open' : ''}" data-key="${key}" style="--cat-color:${cat.color}; --cat-light:${cat.light};">
        <div class="card-head">
          <div class="card-ico">${item.ico}</div>
          <div class="card-title">${highlight(item.t, q)}</div>
          <div class="chevron">▾</div>
        </div>
        <div class="card-body">
          <div class="card-body-inner">
            <div class="field">
              <div class="field-label">🔍 Qué es</div>
              <div class="field-text">${highlight(item.q, q)}</div>
            </div>
            <div class="field">
              <div class="field-label">⚙️ Para qué sirve</div>
              <div class="field-text">${highlight(item.p, q)}</div>
            </div>
            <div class="field">
              <div class="field-label">💡 Ejemplo de uso</div>
              <div class="example-box">${highlight(item.e, q)}</div>
            </div>
            <div class="field">
              <div class="field-label">🛠️ Proceso paso a paso</div>
              <ol class="steps">${item.pasos.map(p => `<li>${highlight(p, q)}</li>`).join('')}</ol>
            </div>
          </div>
        </div>
      </div>`;
  }

  function attachCardEvents(container) {
    container.querySelectorAll('.tool-card').forEach(card => {
      const head = card.querySelector('.card-head');
      head.addEventListener('click', () => {
        const key = card.dataset.key;
        if (App.expanded.has(key)) { App.expanded.delete(key); card.classList.remove('open'); }
        else { App.expanded.add(key); card.classList.add('open'); }
      });
    });
  }

        <div class="stat-card"><div class="num">71</div><div class="lbl">Fuentes originales</div></div>
        <div class="stat-card"><div class="num">${DATA.categories.length}</div><div class="lbl">Categorías temáticas</div></div>
        <div class="stat-card"><div class="num">${totalItems()}</div><div class="lbl">Herramientas documentadas</div></div>
        <div class="stat-card"><div class="num">55+</div><div class="lbl">Procesos paso a paso</div></div>
      </div>`;

    const tiles = DATA.categories.map(cat => `
      <div class="cat-tile" data-cat="${cat.id}" style="--tile-color:${cat.color};">
        <div class="ico">${cat.icon}</div>
        <h3>${cat.name}</h3>
        <p>${cat.desc}</p>
        <span class="count-badge">${cat.items.length} herramientas</span>
      </div>`).join('');

    contentEl.innerHTML = stats + `<div class="cat-grid">${tiles}</div>`;
    contentEl.querySelectorAll('.cat-tile').forEach(tile => {
      tile.addEventListener('click', () => { App.view = tile.dataset.cat; render(); });
    });
  }

  function renderCategory(catId) {
    const cat = DATA.categories.find(c => c.id === catId);
    if (!cat) { App.view = 'home'; return renderHome(); }
    viewTitle.innerHTML = `${cat.icon} ${cat.name}`;
    viewSubtitle.textContent = cat.desc;
    const cardsHtml = cat.items.map((item, idx) => cardTemplate(item, cat, `${cat.id}::${idx}`, '')).join('');
    contentEl.innerHTML = `<div class="card-grid">${cardsHtml}</div>`;
    attachCardEvents(contentEl);
  }

  function renderSearch(query) {
    viewTitle.innerHTML = `🔎 Resultados de búsqueda`;
    const q = query.trim();
    const results = [];
    DATA.categories.forEach(cat => {
      cat.items.forEach((item, idx) => {
        const haystack = (item.t + ' ' + item.q + ' ' + item.p + ' ' + item.e + ' ' + item.pasos.join(' ')).toLowerCase();
        if (haystack.includes(q.toLowerCase())) {
          results.push({ item, cat, idx });
        }
      });
    });
    viewSubtitle.textContent = `${results.length} resultado(s) para "${query}"`;

    if (!results.length) {
      contentEl.innerHTML = `<div class="empty-state"><div class="big">🕳️</div>No se encontró ninguna herramienta que coincida con tu búsqueda.</div>`;
      return;
    }
    const cardsHtml = results.map(r => cardTemplate(r.item, r.cat, `${r.cat.id}::${r.idx}`, q)).join('');
    contentEl.innerHTML = `<div class="search-meta">Mostrando resultados de todas las categorías</div><div class="card-grid">${cardsHtml}</div>`;
    attachCardEvents(contentEl);
  }

  function render() {
    renderSidebarNav();
    if (App.query) renderSearch(App.query);
    else if (App.view === 'home') renderHome();
    else renderCategory(App.view);
  }

  // ---------- Search ----------
  const searchInput = document.getElementById('searchInput');
  let searchTimer = null;
  searchInput.addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    const val = e.target.value;
    searchTimer = setTimeout(() => {
      App.query = val.trim();
      render();
    }, 180);
  });

  // ---------- Theme ----------
  const themeToggle = document.getElementById('themeToggle');
  const themeLabel = document.getElementById('themeLabel');
  function applyTheme() {
    if (App.theme === 'auto') {
      document.documentElement.removeAttribute('data-theme');
      themeLabel.textContent = 'Modo automático';
    } else {
      document.documentElement.setAttribute('data-theme', App.theme);
      themeLabel.textContent = App.theme === 'dark' ? 'Modo oscuro' : 'Modo claro';
    }
  }
  themeToggle.addEventListener('click', () => {
    App.theme = App.theme === 'auto' ? 'dark' : (App.theme === 'dark' ? 'light' : 'auto');
    localStorage.setItem('dia-theme', App.theme);
    applyTheme();
  });
  applyTheme();

  // ---------- Mobile sidebar ----------
  const menuToggle = document.getElementById('menuToggle');
  function openMobileSidebar() { sidebar.classList.add('open'); overlay.classList.add('show'); }
  function closeMobileSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('show'); }
  menuToggle.addEventListener('click', openMobileSidebar);
  overlay.addEventListener('click', closeMobileSidebar);

  // ---------- Init ----------
  render();
});
</script>
</body>
</html>
